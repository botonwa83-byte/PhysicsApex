name: PhysApex
options:
  bundleIdPrefix: com.physicsapex
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_LANGUAGE: zh-Hans
schemes:
  PhysApex:
    build:
      targets:
        PhysApex: all
    run:
      config: Debug
      storeKitConfiguration: PhysApex.storekit
    test:
      config: Debug
      storeKitConfiguration: PhysApex.storekit
      targets:
        - PhysApexTests
targets:
  PhysApexTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PhysApexTests
    dependencies:
      - target: PhysApex
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PhysApex:
    type: application
    platform: iOS
    info:
      path: PhysApex/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
    sources:
      - path: PhysApex
        excludes:
          - "Resources/katex/**"
      - path: PhysApex/Resources/katex
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.physicsapex.app
        PRODUCT_NAME: PhysApex
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PhysApex
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ENABLE_PREVIEWS: YES
